allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 35
                buildToolsVersion "35.0.0"
                // Ensure subprojects use Java 17 compile options
                try {
                    compileOptions {
                        sourceCompatibility JavaVersion.VERSION_17
                        targetCompatibility JavaVersion.VERSION_17
                    }
                } catch (ignored) {}
                // If kotlinOptions available, set jvmTarget to 17
                try {
                    kotlinOptions {
                        jvmTarget = '17'
                    }
                } catch (ignored) {}
            }
            // Also ensure Java and Kotlin compile tasks target Java 17 where present
            try {
                project.tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach { task ->
                    task.sourceCompatibility = '17'
                    task.targetCompatibility = '17'
                    if (task.options.respondsTo('release')) {
                        task.options.release = 17
                    }
                }
            } catch (ignored) {}

            try {
                project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kt ->
                    kt.kotlinOptions.jvmTarget = '17'
                    // If Kotlin plugin supports jvmToolchain, set it too
                    try {
                        // Do not modify freeCompilerArgs here to avoid unsupported -Xjvm-default modes
                    } catch (ignored) {}
                }
            } catch (ignored) {}
        }else{
             println "Warning: Android plugin not applied to ${project.name}"
        }
    }
}
subprojects {
    project.tasks.withType(JavaCompile).configureEach { task ->
        task.sourceCompatibility = '17'
        task.targetCompatibility = '17'
        if (task.options.respondsTo('release')) {
            task.options.release = 17
        }
    }

    // Configure Kotlin compile tasks to use JVM target 17
    try {
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kt ->
            kt.kotlinOptions.jvmTarget = '17'
            // If Kotlin plugin supports jvmToolchain, set it too
            try {
                // Do not modify freeCompilerArgs here to avoid unsupported -Xjvm-default modes
            } catch (ignored) {}
        }
    } catch (ignored) {}

    // If Kotlin plugins are applied, ensure Kotlin compile tasks target JVM 17
    plugins.withId('org.jetbrains.kotlin.jvm') {
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kt ->
            kt.kotlinOptions.jvmTarget = '17'
            // keep freeCompilerArgs if present
            if (kt.kotlinOptions.freeCompilerArgs == null) {
                kt.kotlinOptions.freeCompilerArgs = []
            }
        }
    }

    plugins.withId('org.jetbrains.kotlin.android') {
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kt ->
            kt.kotlinOptions.jvmTarget = '17'
            if (kt.kotlinOptions.freeCompilerArgs == null) {
                kt.kotlinOptions.freeCompilerArgs = []
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// Workaround: some third-party plugin modules (from pub.dev) may lack the
// required `namespace` property for Android Gradle Plugin 7+/8+. This can
// cause configuration failures when AGP tries to create library variants.
// Here we provide a safe fallback: for any Android library project that
// doesn't declare a namespace, set a default namespace so the build can
// configure. This avoids editing files in the pub cache.
subprojects {
    afterEvaluate { project ->
        try {
            if (project.plugins.hasPlugin('com.android.library')) {
                def androidExt = project.extensions.findByName('android')
                if (androidExt != null) {
                    // If the library hasn't set a namespace, set a default one.
                    // Use the root app's application id as a reasonable default.
                    def hasNamespace = false
                    try {
                        hasNamespace = androidExt.hasProperty('namespace') && androidExt.namespace != null
                    } catch (ignored) {
                        // some AGP versions throw when querying namespace; ignore
                    }
                    if (!hasNamespace) {
                        project.extensions.configure(org.gradle.api.plugins.ExtensionAware, {
                            // configure via the Android library extension if possible
                        })
                        try {
                            project.android.namespace = 'com.e3inspections.multitenant'
                            println "[build.gradle] Set default namespace for ${project.name} to com.e3inspections.multitenant"
                        } catch (err) {
                            // best-effort only; if this fails, let AGP report original error
                            println "[build.gradle] Failed to set namespace for ${project.name}: ${err.message}"
                        }
                    }
                }
            }
        } catch (ignored) {}
    }
}