  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.5
  rxdart: ^0.27.7
  http: ^1.0.0
  google_fonts: ^4.0.3
  intl: ^0.19.0
  flutter_material_pickers: ^3.5.0
  async: ^2.10.0
  image_picker: ^1.0.0
  camera: ^0.10.5
  path_provider:
  path:
  shared_preferences: ^2.1.0
  cached_network_image: ^3.3.1
  realm: ^3.0.0
  speech_to_text: ^6.1.1
  json_annotation: ^4.8.0
  smartstruct: ^1.4.0
  provider: ^6.0.5
  image_editor_plus: ^1.0.6
  assorted_layout_widgets: ^8.0.4
  share_plus: ^7.0.2
  syncfusion_flutter_pdfviewer: ^24.2.8
  webview_flutter: ^4.2.2
  webview_flutter_android: ^3.8.1
  webview_flutter_wkwebview: ^3.6.1
  printing: ^5.13.4
  pdf: ^3.11.1
  thumbnailer: ^2.2.0
  connectivity_plus: ^6.0.5
  awesome_notifications: ^0.8.2
  package_info_plus: ^4.2.0
  wakelock_plus: ^1.1.4
  image_gallery_saver: ^2.0.3
  google_maps_place_picker_mb: ^3.1.2
  google_maps_flutter: ^2.5.3
  google_maps_flutter_platform_interface: ^2.4.3
  google_maps_flutter_android: ^2.6.2
  google_maps_flutter_ios: ^2.3.6
  maps_launcher: ^2.2.1
  
  string_validator: ^1.1.0
  flutter_serial_communication: ^0.2.5
  serial_communication: ^0.0.2
  device_info_plus: ^9.1.2
  udp: ^5.0.3
  flutter_mjpeg: ^2.0.4
